<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统维护中</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="maintenance-modal">
        <div class="maintenance-content">
            <div class="maintenance-icon">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>
            <h2>系统维护中</h2>
            <p>服务器正在维护中，请稍后重试。或联系管理员</p>
            <p class="maintenance-hint">err:404notfind</p>
            <div class="game-redirect-btn">
                <button onclick="window.location.href='/game'" class="btn btn-primary btn-block">试试小游戏休闲一下</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        function parseBrowser(ua) {
            if (ua.includes('Edg/')) return 'Edge';
            if (ua.includes('Chrome/') && !ua.includes('Chromium')) return 'Chrome';
            if (ua.includes('Firefox/')) return 'Firefox';
            if (ua.includes('Safari/') && !ua.includes('Chrome')) return 'Safari';
            if (ua.includes('Opera') || ua.includes('OPR/')) return 'Opera';
            return 'Unknown';
        }

        function parseOS(ua) {
            if (ua.includes('Windows NT')) return 'Windows';
            if (ua.includes('Mac OS X') || ua.includes('Macintosh')) return 'macOS';
            if (ua.includes('Linux') && !ua.includes('Android')) return 'Linux';
            if (ua.includes('Android')) return 'Android';
            if (ua.includes('iPhone') || ua.includes('iPad') || ua.includes('iPod')) return 'iOS';
            return 'Unknown';
        }

        function getDeviceType(ua) {
            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
                if (/iPad|Tablet/i.test(ua)) return '平板';
                return '手机';
            }
            return '桌面';
        }

        function getNetworkInfo() {
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    return conn.effectiveType || conn.type || '未知';
                }
            } catch(e) {}
            return 'N/A';
        }

        async function getBatteryInfo() {
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100) + '%';
                    const charging = battery.charging ? '充电中' : '放电中';
                    return `${level} (${charging})`;
                }
            } catch(e) {}
            return 'N/A';
        }

        async function getPublicIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip || 'N/A';
            } catch(e) {
                try {
                    const response = await fetch('https://api64.ipify.org?format=json');
                    const data = await response.json();
                    return data.ip || 'N/A';
                } catch(e2) {
                    return 'N/A';
                }
            }
        }

        async function getLocalIP() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({ iceServers: [] });
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    
                    pc.onicecandidate = (event) => {
                        if (!event || !event.candidate) {
                            pc.close();
                            resolve('N/A');
                            return;
                        }
                        const parts = event.candidate.candidate.split(' ');
                        const ip = parts[4];
                        if (ip && ip.match(/^(\d{1,3}\.){3}\d{1,3}$/)) {
                            pc.close();
                            resolve(ip);
                        }
                    };
                    
                    setTimeout(() => {
                        pc.close();
                        resolve('N/A');
                    }, 1000);
                } catch(e) {
                    resolve('N/A');
                }
            });
        }

        let isPageUnloading = false;

        // 监听页面卸载，避免请求中止错误
        window.addEventListener('beforeunload', () => {
            isPageUnloading = true;
        });

        async function collectAndSend() {
            // 如果页面正在卸载，跳过数据收集
            if (isPageUnloading) return;

            try {
                const ua = navigator.userAgent;

                // 使用 AbortController 支持请求取消
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);

                const [publicIP, localIP] = await Promise.all([
                    getPublicIP(),
                    getLocalIP()
                ]);

                clearTimeout(timeoutId);

                // 再次检查页面状态
                if (isPageUnloading) return;

                const info = {
                    platform: parseOS(ua),
                    browser: parseBrowser(ua),
                    screen: `${screen.width}x${screen.height} (${window.devicePixelRatio}x)`,
                    language: navigator.language,
                    deviceType: getDeviceType(ua),
                    cpuCores: navigator.hardwareConcurrency || 'N/A',
                    memory: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'N/A',
                    networkType: getNetworkInfo(),
                    battery: await getBatteryInfo(),
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    touchEnabled: navigator.maxTouchPoints > 0 ? `是(${navigator.maxTouchPoints}点)` : '否',
                    publicIP: publicIP,
                    localIP: localIP
                };

                // 使用 sendBeacon 作为首选方案，它在页面卸载时更可靠
                if (navigator.sendBeacon && !isPageUnloading) {
                    const blob = new Blob([JSON.stringify(info)], { type: 'application/json' });
                    navigator.sendBeacon('/api/device_info', blob);
                    return;
                }

                // 回退到 fetch，但添加信号支持取消
                if (!isPageUnloading) {
                    fetch('/api/device_info', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
                        body: JSON.stringify(info),
                        signal: controller.signal,
                        keepalive: true
                    }).catch(() => {});
                }
            } catch (error) {
                // 静默处理所有错误，避免在错误页面上显示更多错误
            }
        }

        // 延迟执行，避免页面快速跳转时的请求
        if (document.readyState === 'complete') {
            setTimeout(collectAndSend, 100);
        } else {
            window.addEventListener('load', () => setTimeout(collectAndSend, 100));
        }
    })();
    </script>
</body>
</html>
